name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: haulq-app
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haulq
          POSTGRES_PASSWORD: haulq
          POSTGRES_DB: haulq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://haulq:haulq@localhost:5432/haulq_test

    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. package.json's packageManager field is the
      # single source of truth for the pnpm version, and pinning it in both
      # places fails the moment the two drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Catches a CRLF file committed into a path .gitattributes marks as text.
      # A clean checkout must match the index exactly; if it does not, the
      # normalization has regressed and every later diff becomes unreadable.
      - name: Line endings are normalized
        run: git diff --exit-code

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The migration must run against a real Postgres, not be assumed valid.
      # Trigger and constraint errors in sql/post are invisible to typecheck and
      # to drizzle-kit, and they are exactly the parts carrying the guardrails.
      - name: Migrate
        run: pnpm db:migrate

      # Applying twice proves idempotency. sql/pre and sql/post run on every
      # deploy, so a non-idempotent statement breaks the second deploy, not the
      # one that introduced it.
      - name: Migrate again (idempotency)
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

# The `ai-load-dispatcher core` job that used to live here was removed when the
# repositories were split. packages/core now lives in haulq-dispatcher and is
# tested by that repository's own workflow. ADR-0001 keeps the two stacks apart;
# a job here reaching into a sibling directory only worked before the split and
# has been silently failing to find it ever since.
