workflows:
  driver-ios-testflight:
    name: HaulQ Driver — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Deliberately no `triggering.events` — every push would burn a build
    # against Codemagic's 500 free minutes/month, and this app changes fast
    # enough right now that most pushes don't need a fresh TestFlight build.
    # Trigger manually from the Codemagic dashboard, or add `events:` here
    # once that trade is worth it.

    # References the App Store Connect integration by whatever name it was
    # given in the Codemagic dashboard (Team settings → Integrations →
    # App Store Connect) — "HaulQ API Key" is what it's actually named
    # there, not "haulq". If it's ever renamed or recreated, this string
    # has to change to match, or every build fails immediately with
    # 'App Store Connect integration "..." does not exist'.
    integrations:
      app_store_connect: "HaulQ API Key"

    environment:
      # No `ios_signing:` block, deliberately — that shorthand only fetches
      # signing files that already exist, and mixing it with the explicit
      # `app-store-connect fetch-signing-files` script below (which can
      # create them) is exactly what produced "No matching profiles found
      # for bundle identifier ai.haulq.app" on the first real run: nothing
      # had ever generated a distribution certificate or an App Store
      # provisioning profile for this bundle id, and the shorthand has no
      # `--create` equivalent to fall back on.
      vars:
        # Not 'ai.haulq.driver' — Apple wouldn't take that when the account
        # actually tried to register it, only 'ai.haulq.app'. Matches
        # capacitor.config.ts, the Xcode project, and android/app/build.gradle,
        # all updated together when this changed.
        BUNDLE_ID: "ai.haulq.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6804486951
      node: 22.18.0
      xcode: latest
      cocoapods: default

    # Everything below runs with `apps/driver` as the working directory
    # except the first step, which needs the monorepo root to see the
    # pnpm workspace and `@haulq/contracts`.
    scripts:
      - name: Install workspace dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build the driver web bundle
        script: pnpm --filter @haulq/driver build

      - name: Sync the built bundle into the native iOS project
        working_directory: apps/driver
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: apps/driver/ios/App
        script: pod install

      - name: Initialize the build keychain
        script: keychain initialize

      - name: Fetch or create the App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up code signing
        working_directory: apps/driver
        script: xcode-project use-profiles

      - name: Increment the build number
        working_directory: apps/driver
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          agvtool new-version -all $(($LATEST + 1))

      - name: Build the .ipa
        working_directory: apps/driver
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - apps/driver/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
