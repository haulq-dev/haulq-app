workflows:
  driver-ios-testflight:
    name: HaulQ Driver — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Deliberately no `triggering.events` — every push would burn a build
    # against Codemagic's 500 free minutes/month, and this app changes fast
    # enough right now that most pushes don't need a fresh TestFlight build.
    # Trigger manually from the Codemagic dashboard, or add `events:` here
    # once that trade is worth it.

    # Set up once in the Codemagic dashboard (Team settings → Integrations →
    # App Store Connect), named exactly "haulq" so this reference matches.
    # Needs an App Store Connect API key with the App Manager role —
    # App Store Connect → Users and Access → Integrations → App Store
    # Connect API → generate, download the .p8, note the Issuer ID and Key
    # ID. Codemagic wants all three; the .p8 itself never touches this repo.
    integrations:
      app_store_connect: haulq

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ai.haulq.driver
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # The numeric App Store Connect app id — only exists once the app
        # is registered there (My Apps → + → New App, bundle id
        # ai.haulq.driver, matching what capacitor.config.ts already sets).
        # Find it under App Information → General Information → Apple ID.
        APP_STORE_APP_ID: 0000000000
      node: 22.18.0
      xcode: latest
      cocoapods: default

    # Everything below runs with `apps/driver` as the working directory
    # except the first step, which needs the monorepo root to see the
    # pnpm workspace and `@haulq/contracts`.
    scripts:
      - name: Install workspace dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build the driver web bundle
        script: pnpm --filter @haulq/driver build

      - name: Sync the built bundle into the native iOS project
        working_directory: apps/driver
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: apps/driver/ios/App
        script: pod install

      - name: Set up code signing
        working_directory: apps/driver
        script: xcode-project use-profiles

      - name: Increment the build number
        working_directory: apps/driver
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          agvtool new-version -all $(($LATEST + 1))

      - name: Build the .ipa
        working_directory: apps/driver
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - apps/driver/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
