# Render Blueprint for haulq-app.
#
# Two services and a database:
#
#   haulq-api   web service   api.haulq.ai   Fastify, no build step
#   haulq-web   static site   app.haulq.ai   Vite build, served from CDN
#   haulq-db    Postgres 16
#
# Marketing (haulq.ai) is NOT here — it stays an Astro site on a Cloudflare
# Worker. Build plan section 6 keeps them apart deliberately: a copy fix must
# not be able to break the app, and the two want opposite caching.
#
# Apply with: Render Dashboard → Blueprints → New Blueprint Instance.
# Read docs/deploy-render.md first — three things in here need a paid plan.

databases:
  - name: haulq-db
    databaseName: haulq
    user: haulq
    # Postgres 16 is what the schema is written and tested against.
    postgresMajorVersion: "16"
    region: oregon
    # Free expires after 30 days, then 14 days' grace before the data is
    # deleted. Fine for a demo, not for a pilot carrier's records — see the
    # runbook.
    plan: free
    ipAllowList: []   # no external connections; services connect internally

services:
  # --------------------------------------------------------------------------
  # API
  # --------------------------------------------------------------------------
  - type: web
    name: haulq-api
    runtime: node
    region: oregon
    plan: starter
    # Root of the pnpm workspace, not apps/api. The lockfile and the shared
    # packages live here, and pnpm needs to see all of them.
    rootDir: .
    healthCheckPath: /health

    # Only rebuild when something the API depends on changes. Without this every
    # CSS tweak in apps/web redeploys the API.
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json

    # `npm i -g pnpm`, not `corepack enable`.
    #
    # Corepack verifies the package manager's registry signature against keys
    # baked into the Node build. Older Node 22 images ship stale keys, and the
    # failure is `Cannot find matching keyid` during `corepack enable` — before
    # a single dependency is fetched. Installing pnpm from npm skips that
    # machinery entirely and pins the exact version that generated the lockfile.
    buildCommand: npm i -g pnpm@9.15.9 && pnpm install --frozen-lockfile

    # Migrations run after the build and before the new version takes traffic,
    # so a deploy that cannot migrate never serves. REQUIRES A PAID INSTANCE —
    # on free, run migrations by hand (see the runbook).
    preDeployCommand: pnpm --filter @haulq/db migrate

    # No build step: Node strips the types on load. The flag is required on
    # Node 22 and becomes the default on 23+. `.node-version` pins 22.22.3,
    # which is the version this was tested against and late enough in the 22
    # line that type stripping no longer prints an ExperimentalWarning.
    #
    # `node` directly, NOT `pnpm --filter @haulq/api start`. Measured: Render
    # sends SIGTERM on shutdown, and with pnpm in front the signal stops at the
    # pnpm process — the Fastify `onClose` hook never runs, the Postgres pool is
    # never drained, and the orphaned child keeps answering requests. Invoking
    # node directly makes the process that handles SIGTERM the one that receives
    # it.
    startCommand: node --experimental-strip-types apps/api/src/index.ts

    # ------------------------------------------------------------------
    # No envVars here. Doppler owns this service's entire environment.
    # ------------------------------------------------------------------
    #
    # The Doppler→Render integration REPLACES the service's variable list on
    # every sync rather than merging into it. Anything declared here survives
    # exactly until the next sync and then silently disappears — which is how
    # DATABASE_URL, WEB_ORIGIN and AUTH_PROVIDER were lost on 2026-08-18.
    #
    # Two of those three failed safely. AUTH_PROVIDER defaults to `dev`, and
    # DevAuthenticator refuses to construct under NODE_ENV=production, so the
    # boot fails loudly instead of serving header-trusting auth. WEB_ORIGIN is
    # the one to watch: it defaults to http://localhost:5173, which breaks CORS
    # AND puts a localhost link in every invitation email. Nothing errors.
    #
    # So the whole runtime environment lives in Doppler's `prd` config:
    #
    #   NODE_ENV=production          LOG_LEVEL=info
    #   DATABASE_URL                 see the note below
    #   WEB_ORIGIN=https://app.haulq.ai
    #   AUTH_PROVIDER=clerk          CLERK_SECRET_KEY, CLERK_WEBHOOK_SECRET
    #   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
    #   POSTMARK_SERVER_TOKEN        EMAIL_FROM=hello@haulq.ai
    #   OUTBOX_POLL_MS=5000          nothing sends while this is 0 or unset
    #   CREDENTIAL_ENCRYPTION_PUBLIC_KEY / _PRIVATE_KEY
    #
    # DATABASE_URL is now copied by hand, which `fromDatabase` used to do. Take
    # the INTERNAL connection string from the haulq-db dashboard — same region,
    # private network, and not reachable from outside Render.
    #
    # The cost of copying it: if the database is ever recreated, its connection
    # string changes and Doppler still holds the old one. That failure is at
    # least loud — /ready checks the connection, so the deploy goes unhealthy
    # immediately rather than serving against nothing.
    #
    # STORAGE_DIR is in Doppler too, but it is now only a fallback: the server
    # picks R2 whenever the R2_* variables are present, and warns at boot if it
    # finds itself on the local disk in production.

  # --------------------------------------------------------------------------
  # Web
  # --------------------------------------------------------------------------
  - type: web
    runtime: static
    name: haulq-web
    rootDir: .
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json

    # `npm i -g pnpm`, not `corepack enable`.
    #
    # Corepack verifies the package manager's registry signature against keys
    # baked into the Node build. Older Node 22 images ship stale keys, and the
    # failure is `Cannot find matching keyid` during `corepack enable` — before
    # a single dependency is fetched. Installing pnpm from npm skips that
    # machinery entirely and pins the exact version that generated the lockfile.
    buildCommand: npm i -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm --filter @haulq/web build
    staticPublishPath: apps/web/dist

    envVars:
      # Vite inlines this at BUILD time. Changing it needs a rebuild, not a
      # restart — a restart of a static site does nothing.
      #
      # Literal for the same reason as WEB_ORIGIN: `property: host` gives
      # `haulq-api.onrender.com` with no scheme, and the client would build
      # request URLs against it that go nowhere.
      - key: VITE_API_URL
        value: https://api.haulq.ai

      # Clerk's publishable key. Not a secret — it ships to the browser — but it
      # is read at BUILD time like everything VITE_-prefixed, so setting it
      # requires a rebuild, not a restart.
      #
      # If this is absent the app builds in dev-auth mode and the sign-in screen
      # never appears. That combination against a production API is a web app
      # that 401s on every request, so treat a missing key here as a broken
      # deploy rather than a degraded one.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

    routes:
      # Client-side routing. Without this, loading /import directly returns 404
      # because there is no such file — the router only exists once index.html
      # has booted.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Fonts and CSS are content-hashed by Vite, so they can be cached hard.
      # index.html must not be, or a deploy takes an hour to reach anyone.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
